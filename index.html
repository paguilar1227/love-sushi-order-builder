<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Sushi Order Builder</title><style>
:root{--r:#c8102e;--bg:#fff8f0;--ink:#222}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--r);color:#fff;padding:10px 14px;z-index:5}header h1{margin:0;font-size:1.2rem}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}#tabs button{white-space:nowrap;border:0;border-radius:14px;padding:5px 10px;background:#fff3;color:#fff}#tabs button.on{background:#fff;color:var(--r)}
#search{width:100%;padding:7px;border-radius:8px;border:0;margin-top:6px}
main{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}@media(max-width:800px){main{grid-template-columns:1fr}}
.item{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;box-shadow:0 1px 2px #0001}
.item small{color:#666;display:block}.price{font-weight:600;white-space:nowrap}.note{color:#666;font-size:.85rem;margin:4px 0 8px}
aside{background:#fff;border-radius:10px;padding:12px;align-self:start;position:sticky;top:120px}
.line{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid #eee;font-size:.9rem}.line small{color:#666;display:block}
.qty button{width:26px}.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .g{font-weight:700;font-size:1.1rem;border-top:2px solid var(--ink);margin-top:4px;padding-top:4px}
button.p{background:var(--r);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button.s{border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
dialog{border:0;border-radius:12px;max-width:440px;width:92%}dialog h3{margin-top:0}.grp{margin:8px 0}.grp label{display:block;padding:3px 0}.err{color:var(--r);font-size:.85rem}
.saved{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #eee}.flag{color:var(--r)}
</style></head><body>
<header><h1>Love Sushi · Order Builder</h1><input id="search" placeholder="Search the menu"><div id="tabs"></div></header>
<main><section id="list"></section>
<aside><h3 style="margin:0 0 6px">Order</h3><div id="cart"></div>
<div class="tot" id="tot"></div>
<div style="margin:8px 0;font-size:.9rem">Tip <select id="tip"><option value="0">None</option><option value="15">15%</option><option value="18">18%</option><option value="20">20%</option><option value="c">Custom</option></select>
<input id="tipc" type="number" step="0.01" min="0" style="width:70px;display:none" placeholder="$"> &nbsp;<label><input type="checkbox" id="party"> Party of 6+</label></div>
<div style="font-size:.9rem">Tax rate <input id="rate" type="number" step="0.01" min="0" style="width:64px">%</div>
<div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap"><button class="p" id="save">Save order</button><button class="s" id="clear">Clear</button></div>
<h4 style="margin:10px 0 4px">Saved orders</h4><div id="saved"></div>
<div style="display:flex;gap:6px;margin-top:8px"><button class="s" id="exp">Export</button><label class="s" style="cursor:pointer">Import<input type="file" id="imp" accept=".json" hidden></label></div>
</aside></main>

};const $=s=>document.querySelector(s);const fmt=n=>'$'+n.toFixed(2);
const idx={};M.categories.forEach(c=>c.items.forEach(i=>idx[i.id]=i));
const LS=k=>JSON.parse(localStorage.getItem('ls_'+k)||'null'),SS=(k,v)=>localStorage.setItem('ls_'+k,JSON.stringify(v));
let cart=LS('cart')||[],cur=M.categories[0].id;
function importLine(l){
const qty=Number(l&&l.qty);
if(!l||typeof l.id!='string'||!l.id||!Array.isArray(l.opts)||!['number','string'].includes(typeof l.qty)||!Number.isSafeInteger(qty)||qty<=0)throw new Error('Invalid order quantity or line');
return{id:l.id,opts:l.opts.map(g=>Array.isArray(g)?g.map(ci=>Number.isInteger(ci)?ci:null):null),qty}
}
const cents=n=>Math.round((n+Math.abs(n)*Number.EPSILON)*100)/100;
function unit(l){
const it=idx[l.id];if(!it||!Array.isArray(l.opts))return null;
const groups=it.options||[];if(l.opts.length>groups.length)return null;
let p=it.price;
for(let gi=0;gi<groups.length;gi++){
const g=groups[gi],chosen=l.opts[gi]===undefined?[]:l.opts[gi],n=g.pick||1;
if(!Array.isArray(chosen)||(g.required?chosen.length!=n:chosen.length>(g.pick||g.choices.length)))return null;
if(!g.pick&&new Set(chosen).size!=chosen.length)return null;
for(const ci of chosen){if(!Number.isInteger(ci)||ci<0||ci>=g.choices.length)return null;p+=g.choices[ci].delta}
}
return p}
function optText(l){const it=idx[l.id];if(!it||unit(l)==null)return'';return(it.options||[]).map((g,gi)=>(l.opts[gi]||[]).map(ci=>g.choices[ci].label).join(', ')).filter(Boolean).join(' · ')}
function tabs(){$('#tabs').innerHTML=M.categories.map(c=>`<button data-c="${c.id}" class="${c.id==cur?'on':''}">${c.name}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;$('#search').value='';tabs();list()})}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function list(){const q=$('#search').value.trim().toLowerCase();let h='';M.categories.forEach(c=>{if(!q&&c.id!=cur)return;const its=c.items.filter(i=>!q||(i.name+' '+(i.desc||'')).toLowerCase().includes(q));if(!its.length)return;h+=`<h3>${esc(c.name)}</h3>`+(c.note?`<div class="note">${esc(c.note)}</div>`:'');its.forEach(i=>h+=`<div class="item" data-id="${i.id}"><div>${esc(i.name)}${i.desc?`<small>${esc(i.desc)}</small>`:''}</div><div class="price">${i.options&&i.options.some(g=>g.choices.some(x=>x.delta))?'from ':''}${fmt(i.price)}</div></div>`)});$('#list').innerHTML=h||'<p>No matches.</p>';$('#list').querySelectorAll('.item').forEach(d=>d.onclick=()=>choose(d.dataset.id))}
function choose(id){const it=idx[id];if(!it.options){add({id,opts:[],qty:1});return}
let h=`<h3>${esc(it.name)} · ${fmt(it.price)}</h3>`;it.options.forEach((g,gi)=>{const n=g.pick||1,multi=n>1;h+=`<div class="grp"><b>${esc(g.group)}</b>${multi?` (pick ${n}, repeats OK)`:''}${g.required?'':' (optional)'}`;
if(multi){for(let k=0;k<n;k++)h+=`<label>#${k+1} <select data-g="${gi}">${g.choices.map((c,ci)=>`<option value="${ci}">${esc(c.label)}</option>`).join('')}</select></label>`}
else g.choices.forEach((c,ci)=>h+=`<label><input type="${g.required?'radio':'checkbox'}" name="g${gi}" value="${ci}" ${g.required&&ci==0?'checked':''}> ${esc(c.label)}${c.delta?` (${c.delta>0?'+':''}${fmt(c.delta)})`:''}</label>`);h+='</div>'});
h+=`<div style="display:flex;gap:6px;justify-content:flex-end"><button class="s" value="x">Cancel</button><button class="p" value="ok">Add</button></div>`;$('#dform').innerHTML=h;const d=$('#dlg');d.showModal();
d.onclose=()=>{if(d.returnValue!='ok')return;const opts=it.options.map((g,gi)=>{if((g.pick||1)>1)return[...$('#dform').querySelectorAll(`select[data-g="${gi}"]`)].map(s=>+s.value);return[...$('#dform').querySelectorAll(`input[name="g${gi}"]:checked`)].map(x=>+x.value)});add({id,opts,qty:1})}}
function add(l){const k=JSON.stringify([l.id,l.opts]);const e=cart.find(x=>JSON.stringify([x.id,x.opts])==k);e?e.qty++:cart.push(l);render()}
function totals(){let sub=0,missing=0;cart.forEach(l=>{const u=unit(l);u==null?missing++:sub+=u*l.qty});const rate=(+$('#rate').value||0)/100;const tax=sub*rate;const party=$('#party').checked;let tip=0;const t=$('#tip').value;
if(party)tip=sub*.18;else if(t=='c')tip=Math.max(0,+$('#tipc').value||0);else tip=sub*(+t)/100;
sub=cents(sub);const roundedTax=cents(tax),roundedTip=cents(tip);
return{sub,tax:roundedTax,tip:roundedTip,party,total:cents(sub+roundedTax+roundedTip),missing}}
function render(){SS('cart',cart);$('#cart').innerHTML=cart.length?cart.map((l,i)=>{const it=idx[l.id],u=unit(l);return`<div class="line"><div>${it?esc(it.name):'<span class="flag">Item no longer on menu</span>'}${it&&u==null?'<small class="flag">Choices invalid or no longer available</small>':''}<small>${esc(optText(l))}</small></div><div class="qty"><button data-i="${i}" data-d="-1">−</button> ${l.qty} <button data-i="${i}" data-d="1">+</button><div style="text-align:right">${u==null?'—':fmt(u*l.qty)}</div></div></div>`}).join(''):'<p class="note">Tap an item to add it.</p>';
$('#cart').querySelectorAll('button').forEach(b=>b.onclick=()=>{const l=cart[b.dataset.i];l.qty=Number(l.qty)+Number(b.dataset.d);if(l.qty<1)cart.splice(b.dataset.i,1);render()});
const T=totals();$('#tot').innerHTML=`<div><span>Subtotal</span><span>${fmt(T.sub)}</span></div><div><span>Tax (${$('#rate').value}%)</span><span>${fmt(T.tax)}</span></div><div><span>${T.party?'Gratuity 18% (party of 6+, estimate)':'Tip'}</span><span>${fmt(T.tip)}</span></div><div class="g"><span>Total</span><span>${fmt(T.total)}</span></div>${T.missing?`<div class="err">${T.missing} item(s) or choices no longer available are excluded.</div>`:''}`;$('#tip').disabled=T.party}
function saved(){const S=LS('saved')||[];$('#saved').innerHTML=S.length?S.map((o,i)=>{const miss=o.lines.filter(l=>unit(l)==null).length;return`<div class="saved"><span>${esc(o.name)} <small class="note">(${o.lines.reduce((a,l)=>a+Number(l.qty),0)} items${miss?`, <span class="flag">${miss} unavailable</span>`:''})</small></span><span><button class="s" data-a="load" data-i="${i}">Load</button> <button class="s" data-a="ren" data-i="${i}">Rename</button> <button class="s" data-a="dup" data-i="${i}">Copy</button> <button class="s" data-a="del" data-i="${i}">✕</button></span></div>`}).join(''):'<p class="note">None yet.</p>';
$('#saved').querySelectorAll('button').forEach(b=>b.onclick=()=>{const S=LS('saved')||[],i=+b.dataset.i,o=S[i];if(b.dataset.a=='load'){if(cart.length&&!confirm('Replace the current order with "'+o.name+'"?'))return;cart=JSON.parse(JSON.stringify(o.lines));render()}
if(b.dataset.a=='ren'){const n=prompt('New name',o.name);if(n)o.name=n.trim()}if(b.dataset.a=='dup')S.splice(i+1,0,{...JSON.parse(JSON.stringify(o)),name:o.name+' (copy)'});if(b.dataset.a=='del'&&confirm('Delete "'+o.name+'"?'))S.splice(i,1);SS('saved',S);saved()})}
$('#save').onclick=()=>{if(!cart.length)return alert('Add something first.');const n=prompt('Name this order','Usual');if(!n)return;const S=LS('saved')||[];const ex=S.findIndex(o=>o.name==n.trim());const rec={name:n.trim(),lines:cart.map(({id,opts,qty})=>({id,opts,qty})),saved:new Date().toISOString()};if(ex>=0){if(!confirm('Overwrite "'+n+'"?'))return;S[ex]=rec}else S.push(rec);SS('saved',S);saved()};
$('#clear').onclick=()=>{if(cart.length&&confirm('Clear the order?')){cart=[];render()}};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,saved:LS('saved')||[]},null,1)],{type:'application/json'}));a.download='love-sushi-orders.json';a.click()};
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.v!==1||!Array.isArray(d.saved))throw new Error('Invalid export');const ok=d.saved.map(o=>{if(!o||typeof o.name!='string'||!Array.isArray(o.lines))throw new Error('Invalid order');return{name:o.name,lines:o.lines.map(importLine),saved:typeof o.saved=='string'?o.saved:undefined}});SS('saved',(LS('saved')||[]).concat(ok));saved();alert('Imported '+ok.length+' order(s).')}catch{alert('That file is not an order export.')}finally{e.target.value=''}};
$('#rate').value=LS('rate')??(M.taxRateDefault*100).toFixed(2);$('#rate').oninput=()=>{SS('rate',$('#rate').value);render()};
$('#tip').onchange=()=>{$('#tipc').style.display=$('#tip').value=='c'?'inline':'none';render()};$('#tipc').oninput=render;$('#party').onchange=render;$('#search').oninput=list;
tabs();list();render();saved();
